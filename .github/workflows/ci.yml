name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, compiler: cl, preset: debug }
          - { os: windows-latest, compiler: cl, preset: asan }
          - { os: ubuntu-latest, compiler: g++, preset: debug }
          - { os: ubuntu-latest, compiler: g++, preset: asan }
          - { os: ubuntu-latest, compiler: clang++, preset: debug }
          - { os: ubuntu-latest, compiler: clang++, preset: asan }
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Python test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build --preset ${{ matrix.preset }} --parallel 2 2>&1 | tee build.log; then
            # Job logs need a GitHub sign-in but annotations are public: surface the errors.
            grep -E 'error|warning' build.log | head -n 10 | sed 's/^/::error::/'
            exit 1
          fi
      - name: Test
        if: runner.os != 'Windows'
        run: ctest --preset ${{ matrix.preset }} --verbose
      - name: Test with Windows stall policy
        if: runner.os == 'Windows'
        run: python scripts/run_test_policy.py --preset ${{ matrix.preset }}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tests-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.preset }}
          include-hidden-files: true
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            .local/review/
            build/${{ matrix.preset }}/.local/review/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: clang-format --version
      - name: Check C++ formatting
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
      - run: ruff check .
      - run: ruff format --check .

  # ThreadSanitizer runs the multi-threaded suites (CTest label "concurrency"):
  # the SPSC ring stress tests and the threaded pipeline. It is the gate for data
  # races; Windows has no TSan.
  tsan:
    name: ubuntu-latest / ${{ matrix.compiler }} / tsan
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-latest
    env:
      CXX: ${{ matrix.compiler }}
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: cmake --preset tsan
      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build --preset tsan --parallel 2 2>&1 | tee build.log; then
            grep -E 'error|warning' build.log | head -n 10 | sed 's/^/::error::/'
            exit 1
          fi
      - name: Test
        run: |
          set -o pipefail
          if ! ctest --preset tsan --verbose -L concurrency 2>&1 | tee test.log; then
            grep -E 'ThreadSanitizer|FAILED|Failure|Timeout|error' test.log | head -n 10 \
              | sed 's/^/::error::/'
            exit 1
          fi
